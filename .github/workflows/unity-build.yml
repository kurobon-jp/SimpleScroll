name: Unity tests and Player script compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UNITY_VERSION: '2022.3.43f1'
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: Test (EditMode / PlayMode)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: ${{ steps.tests.outputs.artifactsPath }}

  compile-player:
    name: Compile Player scripts (Windows)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-player-windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-player-windows-${{ env.UNITY_VERSION }}-

      - name: Install CI compilation entry point
        shell: bash
        run: |
          mkdir -p Assets/Editor/CI
          cp .github/unity/PlayerScriptCompiler.cs Assets/Editor/CI/PlayerScriptCompiler.cs

      - uses: game-ci/unity-builder@v6
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: SimpleScrollCI.PlayerScriptCompiler.CompileWindows
          versioning: None
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: Player-scripts-Windows
          path: Temp/PlayerScripts/StandaloneWindows64
