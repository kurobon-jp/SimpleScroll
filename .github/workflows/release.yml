name: Sign and Release UPM Package

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, 1.0.11)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Sign and release UPM package
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      DIST_DIR: /tmp/signed-upm-dist
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Read and validate package metadata
        shell: bash
        run: |
          package_name="$(jq -r '.name' Assets/package.json)"
          package_version="$(jq -r '.version' Assets/package.json)"
          tag_version="${RELEASE_TAG#v}"

          if [[ "$package_name" != "com.github.kurobon.simple_scroll" ]]; then
            echo "Unexpected package name: $package_name" >&2
            exit 1
          fi

          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)" >&2
            exit 1
          fi

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install Unity UPM CLI
        shell: bash
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        run: upm --version

      - name: Pack and sign UPM package
        shell: bash
        run: |
          mkdir -p "$DIST_DIR"
          upm pack ./Assets \
            --organization-id "$UPM_ORG_ID" \
            --destination "$DIST_DIR"

      - name: Verify signed package
        shell: bash
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)

          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed archive, found ${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          archive_entries="$(tar -tzf "$archive")"
          grep -Fxq 'package/package.json' <<< "$archive_entries"
          grep -Fxq 'package/.attestation.p7m' <<< "$archive_entries"

          archive_name="$(tar -xOzf "$archive" package/package.json | jq -r '.name')"
          archive_version="$(tar -xOzf "$archive" package/package.json | jq -r '.version')"

          if [[ "$archive_name" != "$PACKAGE_NAME" || "$archive_version" != "$PACKAGE_VERSION" ]]; then
            echo "Signed archive metadata does not match Assets/package.json" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            /tmp/signed-upm-dist/*.tgz
            /tmp/signed-upm-dist/*.tar.gz

      - name: Publish signed package to OpenUPM
        uses: openupm/openupm-action@v1
        with:
          package: com.github.kurobon.simple_scroll
          tag: ${{ env.RELEASE_TAG }}
          timeout-minutes: 30
