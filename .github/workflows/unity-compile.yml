name: Unity 2022.1 compilation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile / Unity 2022.1.25f1
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Unity activation configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" || ( -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ) ]]; then
            echo "Unity activation configuration is available."
          else
            echo "::error::Configure UNITY_LICENSE or both UNITY_EMAIL and UNITY_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Create isolated consumer
        run: python .github/unity/prepare_project.py 2022.1.25f1

      - name: Compile package and sample assemblies
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: Temp/unity-compile
          unityVersion: 2022.1.25f1
          testMode: EditMode
          checkName: Compilation / Unity 2022.1.25f1
          artifactsPath: artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-compile-2022.1.25f1
          path: |
            artifacts/
            Temp/unity-compile/compile-success.txt
            Temp/unity-compile/Packages/manifest.json
            Temp/unity-compile/Packages/packages-lock.json
          if-no-files-found: ignore
